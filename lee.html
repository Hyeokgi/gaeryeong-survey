<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B3B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>논 타작물 이행점검 · 이승현</title>
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#0E1614; --ink2:#5A6B66; --ink3:#8D9C97;
  --line:#E3E9E7; --brand:#0B3B33; --brand2:#14574A; --mint:#E8F3EF;
  --car:#14574A; --walk:#1D4E89; --need:#8A5A00;
  --sh:0 1px 2px rgba(14,22,20,.05),0 4px 14px rgba(14,22,20,.05);
  --sh2:0 2px 6px rgba(14,22,20,.07),0 12px 28px rgba(14,22,20,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.011em;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ══ 헤더 ══ */
header{position:sticky;top:0;z-index:60;background:var(--brand);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  border-radius:0 0 20px 20px;box-shadow:var(--sh2)}
.hrow{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:0 0 auto;width:52px;height:52px}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:#6FD3B4;transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.htxt h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.htxt p{margin:2px 0 0;font-size:12.5px;color:#9CBDB3;font-weight:500}
.vrow{display:flex;gap:6px;overflow-x:auto;margin:13px 0 0;padding-bottom:2px;scrollbar-width:none}
.vrow::-webkit-scrollbar{display:none}
.vrow button{flex:0 0 auto;padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.09);color:#A8C6BD;white-space:nowrap;transition:.16s}
.vrow button[aria-selected=true]{background:#6FD3B4;color:#0B3B33;font-weight:700}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.09);border-radius:11px;padding:4px;margin:9px 0 0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-width:64px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:600;
  color:#A8C6BD;transition:.18s;white-space:nowrap}
.seg button[aria-selected=true]{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.13)}
.seg button b{font-weight:700}
.srch{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:0 0 13px}
.srch input{flex:1;min-width:0;background:rgba(255,255,255,.12);border:0;border-radius:10px;
  padding:10px 13px;color:#fff;font:inherit;font-size:14px}
.srch input::placeholder{color:#8FB0A7}
.srch input:focus{outline:2px solid #6FD3B4;outline-offset:0}

/* ══ 경고 배너 ══ */
.warn{margin:12px 14px 0;background:#FFF4E0;border:1px solid #F0DCB4;border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:#7A5200;line-height:1.55;display:none}
.warn.on{display:block}
.warn b{display:block;margin-bottom:3px;font-size:13px}

/* ══ 카드 ══ */
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--sh);margin-bottom:11px;
  overflow:hidden;position:relative;transition:.2s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.car::before{background:var(--car)}
.card.walk::before{background:var(--walk)}
.card.need::before{background:var(--need)}
.card.done{opacity:.62}
.body{display:flex;gap:13px;padding:15px 16px 13px 18px;align-items:flex-start}
.jb{flex:1;min-width:0}
.jbnum{font-size:25px;font-weight:750;letter-spacing:-.035em;line-height:1.1}
.jbnum em{font-style:normal;font-size:14px;font-weight:600;color:var(--ink3);margin-left:5px;letter-spacing:0}
.own{font-size:13.5px;color:var(--ink2);font-weight:600;margin-top:3px}
.fx{font-size:12px;color:var(--ink3);margin-top:5px;font-weight:500}
.rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ord{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.02em}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.car{background:var(--mint);color:var(--car)}
.pill.walk{background:#E7EFF9;color:var(--walk)}
.pill.need{background:#FBF0DC;color:var(--need)}
.shot{font-size:11.5px;font-weight:700;color:var(--car);background:var(--mint);
  padding:4px 10px;border-radius:99px;min-height:30px;display:inline-flex;align-items:center}
.shot:active{background:#D6E9E1}
.vbadge{display:inline-block;font-size:10px;font-weight:700;color:var(--brand2);background:var(--mint);
  padding:1px 7px;border-radius:99px;margin-right:4px;vertical-align:middle}
.memo{display:flex;gap:8px;align-items:flex-start;padding:0 16px 13px 18px;margin-top:-4px}
.memo button{flex:1;text-align:left;background:var(--bg);border:1.5px solid transparent;border-radius:10px;
  padding:8px 12px;font-size:12.5px;color:var(--ink2);line-height:1.5;transition:.14s;min-height:38px}
.memo button:active{background:#E4EAE8}
.memo button.none{color:var(--ink3)}
.memo button.none::before{content:'+ ';font-weight:700;color:var(--ink3)}
.memo button.has{background:#FFF6DD;border-color:#F0D796}
.memo button.has b{color:#8A5A00}
.memo b{display:block;font-size:10.5px;font-weight:700;color:var(--brand2);margin-bottom:2px;letter-spacing:.02em}
.memo b::before{content:'✎ ';font-weight:400}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pgrid figure{margin:0;background:var(--bg);border-radius:12px;overflow:hidden}
.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#DCE4E1}
.pgrid figcaption{font-size:10.5px;color:var(--ink2);padding:7px 9px 0;line-height:1.4;word-break:break-all}
.pgrid .pact{display:flex;gap:1px;margin-top:7px;background:var(--line)}
.pgrid .pact button{flex:1;min-height:44px;background:var(--surface);padding:9px 4px;font-size:11.5px;font-weight:650}
.pgrid .pact button:active{background:#EFF4F2}
.pgrid .pact .pdel{color:#B3261E}
.pnote{font-size:12px;color:var(--ink3);line-height:1.6;margin:0 0 4px}
.acts{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:1px;background:var(--line)}
.acts>*{background:var(--surface);min-height:50px;display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:13.5px;font-weight:650;text-decoration:none;color:var(--ink);transition:.14s}
.acts>*:active{background:#EFF4F2}
.a-map{color:var(--walk)}
.a-cam{color:var(--brand2)}
.a-ok{color:var(--car)}
.a-undo{color:var(--ink3);font-size:12.5px}
.ic{width:17px;height:17px;flex:0 0 auto}
input[type=file]{display:none}

/* ══ 마을 넘기기 ══ */
@keyframes slL{from{transform:translateX(26px);opacity:.35}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-26px);opacity:.35}to{transform:none;opacity:1}}
main.sl{animation:slL .22s cubic-bezier(.22,1,.36,1)}
main.sr{animation:slR .22s cubic-bezier(.22,1,.36,1)}
@media(prefers-reduced-motion:reduce){main.sl,main.sr{animation:none}}

/* ══ 필지 위치 약도 ══ */
.jbnum{display:inline-flex;align-items:baseline;padding:0;text-align:left}
.jbnum .mchev{flex:0 0 auto;width:0;height:0;margin-left:8px;align-self:center;
  border:5px solid transparent;border-top-color:var(--ink3);transform:translateY(2.5px);transition:transform .18s}
.jbnum[aria-expanded=true] .mchev{border-top-color:var(--brand2);transform:rotate(180deg) translateY(2.5px)}
.mini{display:none;padding:0 16px 13px 18px}
.mini.on{display:block}
.mcanvas{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);
  background:#EDF2F0;font-family:inherit}
.mbar{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.mbar button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;min-height:32px;
  background:var(--bg);color:var(--ink2)}
.mbar button[aria-pressed=true]{background:var(--brand);color:#fff}
.mgps{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink2);text-align:right;line-height:1.45}
.mgps b{color:var(--brand2)}
.mleg{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;color:var(--ink3);font-weight:600}
.mleg i{width:11px;height:11px;border-radius:3px;border:1px solid #8FA39C;display:inline-block;margin-left:4px}
.mleg i:first-child{margin-left:0}
.mleg em{font-style:normal;margin-left:auto;color:var(--ink3)}
.mno{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:12px;padding:16px;
  line-height:1.65;text-align:center}
.mno b{color:var(--brand2)}

/* ══ 이행점검 판정 ══ */
.card.ok::before{background:var(--car)}
.card.no::before{background:#B3261E}
.card.hold::before{background:var(--need)}
.card.non::before{background:#CBD5D1}
.pill.ok{background:var(--mint);color:var(--car)}
.pill.no{background:#FDECEC;color:#B3261E}
.pill.hold{background:#FBF0DC;color:var(--need)}
.pill.grp{background:#EDF1F0;color:var(--ink2)}
.tel{color:var(--walk);text-decoration:none;font-weight:650}
.note{margin:-2px 16px 11px 18px;background:#FFF6DD;border:1px solid #F0D796;border-radius:10px;
  padding:8px 11px;font-size:11.5px;color:#7A5200;line-height:1.55}
.note b{font-weight:700}
.rsel{display:flex;gap:8px;margin-bottom:15px}
.rsel button{flex:1;min-height:54px;border-radius:13px;background:var(--bg);font-size:15px;font-weight:700;
  color:var(--ink2);transition:.14s}
.rsel button[aria-pressed=true].ok{background:var(--car);color:#fff}
.rsel button[aria-pressed=true].no{background:#B3261E;color:#fff}
.rsel button[aria-pressed=true].hold{background:var(--need);color:#fff}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em}
.fld input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;
  font-size:15px;background:var(--bg);color:var(--ink)}
.fld input:focus{outline:2px solid var(--brand2);outline-offset:0;background:#fff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:12.5px;margin:0 0 16px;
  background:var(--bg);border-radius:12px;padding:13px 14px}
.dl dt{color:var(--ink3);font-weight:650;white-space:nowrap}
.dl dd{margin:0;color:var(--ink);font-weight:600}

.fx .nx{font-weight:700;color:var(--brand2)}
.fx .nx.off{color:var(--need)}

/* ══ 빈 화면 ══ */
.empty{text-align:center;padding:70px 26px;color:var(--ink2)}
.empty svg{width:46px;height:46px;color:var(--ink3);margin-bottom:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:700}
.empty p{margin:0;font-size:13.5px;line-height:1.65}

/* ══ 하단바 ══ */
footer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;
  max-width:620px;margin:0 auto}
footer button{flex:1;min-height:46px;border-radius:12px;font-size:13px;font-weight:650;
  background:var(--bg);color:var(--ink);transition:.14s}
footer button:active{background:#E4EAE8}
footer button.pri{background:var(--brand);color:#fff}

/* ══ 시트 ══ */
.mask{position:fixed;inset:0;z-index:80;background:rgba(14,22,20,.45);opacity:0;pointer-events:none;transition:.22s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--surface);
  border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:.3s cubic-bezier(.22,1,.36,1);max-width:620px;margin:0 auto;
  max-height:82vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:17px;font-weight:700}
.sheet .sub{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.6}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px;
  border-radius:13px;background:var(--bg);margin-bottom:9px;transition:.14s}
.opt:active{background:#E4EAE8}
a.opt{text-decoration:none;color:inherit}
.opt .oic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--mint);color:var(--brand2);
  display:grid;place-items:center}
.opt .oic svg{width:19px;height:19px}
.opt b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px}
.opt span{font-size:12.5px;color:var(--ink2);line-height:1.5}
.opt.danger .oic{background:#FDECEC;color:#B3261E}
#mtx{width:100%;min-height:132px;border:1px solid var(--line);border-radius:12px;padding:13px;
  font:inherit;font-size:14.5px;line-height:1.6;resize:vertical;background:var(--bg);color:var(--ink)}
#mtx:focus{outline:2px solid var(--brand2);outline-offset:0;background:#fff}
.mbtn{display:flex;gap:9px;margin-top:13px}
.mbtn button{flex:1;min-height:46px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:650}
.mbtn button.pri{flex:2;background:var(--brand);color:#fff}
.mbtn button.dgr{color:#B3261E}

#toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,16px);z-index:100;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.24s;max-width:86vw;text-align:center;box-shadow:var(--sh2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="ring">
      <svg width="52" height="52"><circle class="bg" cx="26" cy="26" r="22"/>
      <circle class="fg" id="ring" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg>
      <span id="pct">0%</span>
    </div>
    <div class="htxt"><h1>논 타작물 이행점검 · 이승현</h1><p id="sub">개령면 신청농지</p></div>
  </div>
  <div class="vrow" id="vrow"></div>
  <div class="seg" id="tabs"></div>
  <div class="srch"><input id="q" type="search" placeholder="지번 · 신청인 · 품목 검색" autocomplete="off"></div>
</header>

<div class="warn" id="warn"><b>기록이 저장되지 않는 환경입니다</b>
카카오톡·문자 앱의 내부 브라우저는 기록을 유지하지 못합니다. 우측 상단 메뉴에서 <b style="display:inline">다른 브라우저로 열기</b>를 선택하거나, 점검 후 <b style="display:inline">기록 백업</b>을 눌러 파일로 보관하세요.</div>

<main id="list"></main>

<footer>
  <button id="btnRep" class="pri">점검기록 정리</button>
  <button id="btnMore">백업 · 설정</button>
</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<input type="file" id="restoreFile" accept=".json,application/json">
<input type="file" id="xlsxFile" accept=".xlsx">
<div id="toast"></div>

/* ── 이행점검 판정 ──
   대장의 1차점검 칸에 그대로 들어가는 값이라 세 갈래를 여기서 한 번만 정한다.
   '보류'는 대장에 없는 값이지만, 현장에서 판단이 안 서는 필지를 미점검과 구분해 두려고 넣었다. */
const RES=['적합','부적합','보류'];
const RCLS={'적합':'ok','부적합':'no','보류':'hold'};
const ALL='전체';

let state={},tab=ALL,vill=null,q='',storageOK=true;
const st=id=>state[id]||{shots:0,res:null};
const isDone=id=>!!st(id).res;
const VILLAGES=[...new Set(PARCELS.map(p=>p.village))];
/* 리 안에서 신청인이 탭이 된다 — 이행점검은 농가 단위로 도는 일이라 그 순서가 동선과 맞는다 */
const villWhos=v=>[...new Set(PARCELS.filter(p=>p.village===v).map(p=>p.who))];
const tabsOf=v=>[ALL,...villWhos(v)];
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return Number.isFinite(n)?n:null};
const comma=v=>v==null?'':v.toLocaleString('ko-KR',{maximumFractionDigits:2});

/* ── 저장소 ── */
const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); if(r) return JSON.parse(r.value);} }catch(e){}
    try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; }
  },
  async set(v){
    const s=JSON.stringify(v); let ok=false;
    try{ if(window.storage){ await window.storage.set(KEY,s); ok=true; } }catch(e){}
    try{ localStorage.setItem(KEY,s); ok=true; }catch(e){}
    return ok;
  }
};
function checkStorage(){
  try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }
  catch(e){ return !!window.storage; }
}

/* ── 보던 위치 ── */
function savePos(){ try{ localStorage.setItem(POS,JSON.stringify({vill,tab})); }catch(e){} }
function restorePos(){
  let p=null; try{ p=JSON.parse(localStorage.getItem(POS)||'null'); }catch(e){}
  if(p && p.vill==='done'){ vill='done'; tab='done'; return; }
  if(p && VILLAGES.includes(p.vill)){
    vill=p.vill; const ts=tabsOf(vill);
    tab=ts.includes(p.tab)?p.tab:ALL; return;
  }
  vill=VILLAGES[0]; tab=ALL;
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2000);}

function dl(blob,name){const a=document.createElement('a');const u=URL.createObjectURL(blob);
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);}

/* ── 렌더 ── */
function renderHead(){
  const d=PARCELS.filter(p=>isDone(p.id)).length, r=d/PARCELS.length;
  document.getElementById('ring').style.strokeDashoffset=138.2*(1-r);
  document.getElementById('pct').textContent=Math.round(r*100)+'%';
  document.getElementById('sub').textContent=`${d} / ${PARCELS.length}필지 점검 완료`;

  const vr=document.getElementById('vrow');
  vr.innerHTML = VILLAGES.map(v=>{
    const n=PARCELS.filter(p=>p.village===v&&!isDone(p.id)).length;
    return `<button data-v="${v}" aria-selected="${vill===v}">${v} <b class="tnum">${n}</b></button>`;
  }).join('') + `<button data-v="done" aria-selected="${vill==='done'}">✓ 완료 <b class="tnum">${d}</b></button>`;
  vr.querySelectorAll('button').forEach(b=>b.onclick=()=>goChip(b.dataset.v));

  const tb=document.getElementById('tabs');
  if(vill==='done'){ tb.style.display='none'; tb.innerHTML=''; return; }
  tb.style.display='flex';
  tb.innerHTML = tabsOf(vill).map(t=>{
    const n=PARCELS.filter(p=>p.village===vill&&(t===ALL||p.who===t)&&!isDone(p.id)).length;
    return `<button data-t="${t}" aria-selected="${tab===t}">${t} <b class="tnum">${n}</b></button>`;
  }).join('');
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; render(); });
}

function render(){
  renderHead(); savePos();
  let rows;
  if(q){
    /* 검색은 보고 있는 리·신청인에 갇히지 않는다 — 85필지뿐이라 전체를 훑어도 부담이 없고,
       현장에서는 "이 지번이 신청 목록에 있나"를 확인하는 쓰임이 더 많다 */
    const k=q.trim().toLowerCase();
    rows=PARCELS.filter(p=>[p.jibun,p.who,p.item,p.village,p.c2,p.tel,p.addr].join(' ').toLowerCase().includes(k));
  }else{
    rows = vill==='done' ? PARCELS.filter(p=>isDone(p.id))
         : PARCELS.filter(p=>p.village===vill && (tab===ALL||p.who===tab) && !isDone(p.id));
  }
  const el=document.getElementById('list');

  if(!rows.length){
    el.innerHTML=`<div class="empty">${IC.empty}<b>${
      q?'검색 결과가 없습니다':vill==='done'?'점검한 필지가 아직 없습니다':'이 구간을 모두 마쳤습니다'}</b>
      <p>${q?'다른 지번·신청인·품목으로 찾아보세요.':vill==='done'?'점검을 기록하면 이곳에 모입니다.':'완료 탭에서 기록을 다시 볼 수 있습니다.'}</p></div>`;
    return;
  }

  el.innerHTML=rows.map(p=>{
    const s=st(p.id), cls=s.res?RCLS[s.res]:'non';
    const area=s.res?`이행 ${comma(num(s.area))||'-'}㎡`:`신청 ${p.aaT}㎡`;
    return `<div class="card ${cls} ${s.res?'done':''}">
      <div class="body">
        <div class="jb">
          <button class="jbnum tnum" data-mini="${p.id}" aria-expanded="${openMini===p.id}">${p.jibun}<em>${p.item}</em><span class="mchev"></span></button>
          <div class="own"><span class="vbadge">${p.village}</span> ${p.who}
            ${p.tel?` · <a class="tel" href="tel:${p.tel.replace(/[^0-9+]/g,'')}">${p.tel}</a>`:''}</div>
          <div class="fx tnum">${area} · ${p.c1}〉${p.c2} · 전년 ${p.prev||'-'}${
            p.dn!=null?` · <b class="nx">다음 ${mfmt(p.dn)}</b>`:GEO[p.id]?'':' · <b class="nx off">위치 자료 없음</b>'}</div>
        </div>
        <div class="rt">
          <span class="ord tnum">${vill==='done'?p.village+' ':''}${String(p.seq).padStart(2,'0')}</span>
          <span class="pill ${s.res?RCLS[s.res]:'grp'}">${s.res||p.grp}</span>
          ${s.shots?`<button class="shot tnum" data-photos="${p.id}">사진 ${s.shots}장 ›</button>`:''}
        </div>
      </div>
      <div class="mini" id="mini-${p.id}"></div>
      ${p.note?`<div class="note"><b>대장 비고</b> ${p.note.replace(/</g,'&lt;')}</div>`:''}
      <div class="memo"><button data-memo="${p.id}" class="${s.memo?'has':'none'}">${
        s.memo?`<b>현장 메모</b>${s.memo.replace(/</g,'&lt;')}`:'현장 메모 남기기'}</button></div>
      <div class="acts">
        <button class="a-map" data-map="${p.id}">${IC.map}지도</button>
        <button class="a-cam" data-cam="${p.id}">${IC.cam}사진 촬영</button>
        <button class="a-ok" data-chk="${p.id}">${IC.ok}${s.res?'점검 수정':'이행점검'}</button>
      </div>
      <input type="file" accept="image/*" capture="environment" id="f-${p.id}">
    </div>`}).join('');

  el.querySelectorAll('[data-cam]').forEach(b=>{const id=b.dataset.cam;
    b.onclick=()=>document.getElementById('f-'+id).click();
    document.getElementById('f-'+id).onchange=e=>shoot(id,e.target);});
  el.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{
    const pp=PARCELS.find(x=>x.id===b.dataset.map); if(pp) openNaverMap(pp.addr);
  });
  el.querySelectorAll('[data-mini]').forEach(b=>b.onclick=()=>toggleMini(b.dataset.mini));
  el.querySelectorAll('[data-photos]').forEach(b=>b.onclick=()=>showPhotos(b.dataset.photos));
  el.querySelectorAll('[data-memo]').forEach(b=>b.onclick=()=>editMemo(b.dataset.memo));
  el.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>editCheck(b.dataset.chk));
  reopenMini();
}
/* ══════════ 필지 위치 약도 (오프라인) ══════════
   통신이 끊긴 곳에서 쓰라고 만든 것이라 지도 타일을 한 장도 받지 않는다.
   좌표는 GEO 에 들어 있고, GPS 는 위성 신호라 데이터가 없어도 잡힌다.
   다만 통신이 없으면 보조 정보를 못 받아 첫 측위가 느리다. */
const MSPANS=[200,400,1000];
let mspan=1, openMini=null, gpsWatch=null, gpsPos=null, gpsErr=0;

const D2R=Math.PI/180;
/* 면 하나 크기에서는 평면으로 놓고 재도 오차가 무시할 만하다 */
const mPerLng=lat=>111320*Math.cos(lat*D2R), M_LAT=110540;
function distBearing(from,to){
  const dx=(to[0]-from[0])*mPerLng(from[1]), dy=(to[1]-from[1])*M_LAT;
  return {d:Math.hypot(dx,dy), b:(Math.atan2(dx,dy)/D2R+360)%360};
}
/* 위치값이 숫자가 아니면 그리지 않는다 — 깨진 좌표로 지도를 망가뜨리지 않기 위해서다 */
const gpsOK=()=>gpsPos&&Number.isFinite(gpsPos.lat)&&Number.isFinite(gpsPos.lng);
const DIRS=['북','북동','동','남동','남','남서','서','북서'];
const dirName=b=>DIRS[Math.round(b/45)%8];
const mfmt=d=>d<1000?Math.round(d)+'m':(d/1000).toFixed(1)+'km';

/* 지목 갈래별 색 — 도로를 흰 여백으로 두면 농로망이 눈에 확 들어온다 */
const CATFILL=['#B9D0E2','#E0CDA6','#FFFFFF','#9CC6DC','#E2CBC5','#C4D7BC','#D6DEDA'];
const CATLINE=['#8FAABE','#BFA97F','#A9B8B2','#7FAAC2','#BFA49E','#A2B99A','#B3BEB9'];

/* 폴리라인 풀기 — 구글 방식 그대로다 */
function decodePoly(s){
  const out=[]; let i=0,x=0,y=0;
  while(i<s.length){
    let r=0,sh=0,b;
    do{ b=s.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    x+=(r&1)?~(r>>1):(r>>1);
    r=0; sh=0;
    do{ b=s.charCodeAt(i++)-63; r|=(b&0x1f)<<sh; sh+=5; }while(b>=0x20);
    y+=(r&1)?~(r>>1):(r>>1);
    out.push(x/1e6,y/1e6);
  }
  return out;
}
let MAPXY=null, MAPBB=null;
function mapInit(){                      /* 처음 지도를 열 때 한 번만 푼다 */
  if(MAPXY) return;
  MAPXY=new Array(MAPG.length); MAPBB=new Float64Array(MAPG.length*4);
  for(let i=0;i<MAPG.length;i++){
    const a=decodePoly(MAPG[i]); MAPXY[i]=a;
    let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
    for(let j=0;j<a.length;j+=2){
      if(a[j]<x0)x0=a[j]; if(a[j]>x1)x1=a[j];
      if(a[j+1]<y0)y0=a[j+1]; if(a[j+1]>y1)y1=a[j+1];
    }
    MAPBB[i*4]=x0; MAPBB[i*4+1]=y0; MAPBB[i*4+2]=x1; MAPBB[i*4+3]=y1;
  }
}

/* ── 나침반 ── 내가 보는 쪽을 위로 돌려 준다. 밭에서는 이게 방향 감각을 가장 크게 좌우한다 */
let heading=null, compassOn=false, compassErr=0;
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;          /* 아이폰 */
  else if(e.absolute&&typeof e.alpha==='number') h=(360-e.alpha)%360;             /* 안드로이드 */
  if(h==null||!Number.isFinite(h)) return;
  if(heading==null||Math.abs(heading-h)>3){ heading=h; refreshMini(); }
}
async function toggleCompass(){
  if(compassOn){ stopCompass(); refreshMini(); return; }
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted'){ compassErr=1; refreshMini(); return; }
    }else if(!window.DeviceOrientationEvent){ compassErr=1; refreshMini(); return; }
  }catch(e){ compassErr=1; refreshMini(); return; }
  compassOn=true; compassErr=0;
  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
  refreshMini();
}
function stopCompass(){
  compassOn=false; heading=null;
  window.removeEventListener('deviceorientationabsolute',onOrient,true);
  window.removeEventListener('deviceorientation',onOrient,true);
}

function miniSvg(p){
  mapInit();
  const c=GEO[p.id], span=MSPANS[mspan], W=320, H=240, k=W/span;
  const rot=(compassOn&&heading!=null?heading:0)*D2R;
  const cs=Math.cos(rot), sn=Math.sin(rot);
  const mlng=mPerLng(c[1]);
  /* 회전을 SVG transform 이 아니라 좌표 계산에 넣는다 — 그래야 글자가 뒤집히지 않는다 */
  const P=g=>{
    const E=(g[0]-c[0])*mlng*k, N=(g[1]-c[1])*M_LAT*k;
    return [W/2+(E*cs-N*sn), H/2-(N*cs+E*sn)];
  };
  /* 돌려도 화면에 걸릴 수 있는 범위까지 넉넉히 잡아 훑는다 */
  const rl=span*0.78/mlng, rt=span*0.78/M_LAT;
  const x0=c[0]-rl, x1=c[0]+rl, y0=c[1]-rt, y1=c[1]+rt;

  const path=i=>{
    const a=MAPXY[i]; let d='';
    for(let j=0;j<a.length;j+=2){
      const xy=P([a[j],a[j+1]]);
      d+=(j?'L':'M')+xy[0].toFixed(1)+' '+xy[1].toFixed(1);
    }
    return d+'Z';
  };

  const mine={}, tgtIdx=MAPL[p.id];
  for(const q of PARCELS) if(MAPL[q.id]!=null) mine[MAPL[q.id]]=q;

  const lots=[[],[],[],[],[],[],[]];
  let ours='', n=0;
  for(let i=0;i<MAPXY.length;i++){
    if(MAPBB[i*4]>x1||MAPBB[i*4+2]<x0||MAPBB[i*4+1]>y1||MAPBB[i*4+3]<y0) continue;
    if(i===tgtIdx) continue;
    const cat=+MAPC[i];
    const d=path(i);
    lots[cat].push(d);
    const q=mine[i];
    if(q) ours+=`<path d="${d}" fill="none" stroke="${q.village===p.village?'#0B3B33':'#2F7D6A'}"
      stroke-width="${q.village===p.village?1.9:1.2}" stroke-linejoin="round"/>`;
    if(++n>2600) break;
  }
  const layers=lots.map((ds,cat)=>ds.length?`<path d="${ds.join('')}" fill="${CATFILL[cat]}"
    stroke="${CATLINE[cat]}" stroke-width=".7" stroke-linejoin="round" fill-rule="evenodd"/>`:'').join('');

  /* 동선은 그 리를 도는 순서 그대로다 — 신청인이 아니라 이동경로로 순번을 매겼기 때문이다 */
  const seqs=PARCELS.filter(q=>q.village===p.village&&GEO[q.id]).sort((a,b)=>a.seq-b.seq);
  const route=seqs.length>1?`<polyline points="${seqs.map(q=>P(GEO[q.id]).map(v=>v.toFixed(1)).join(',')).join(' ')}"
      fill="none" stroke="#0B3B33" stroke-width="1.6" stroke-opacity=".4" stroke-dasharray="5 4"
      stroke-linejoin="round" stroke-linecap="round"/>`:'';

  let marks='', labels='';
  for(const q of seqs){
    if(q.id===p.id) continue;
    const xy=P(GEO[q.id]);
    if(xy[0]<-10||xy[0]>W+10||xy[1]<-10||xy[1]>H+10) continue;
    marks+=`<circle cx="${xy[0].toFixed(1)}" cy="${xy[1].toFixed(1)}" r="6.4" fill="#0B3B33" opacity=".92"/>
      <text x="${xy[0].toFixed(1)}" y="${(xy[1]+2.8).toFixed(1)}" text-anchor="middle" font-size="6.6" font-weight="700" fill="#fff">${q.seq}</text>`;
  }
  if(span<=200) for(const q of PARCELS){
    if(!GEO[q.id]||q.id===p.id) continue;
    const g=GEO[q.id]; if(g[0]<x0||g[0]>x1||g[1]<y0||g[1]>y1) continue;
    const xy=P(g);
    if(xy[0]<6||xy[0]>W-6||xy[1]<12||xy[1]>H-6) continue;
    labels+=`<text x="${xy[0].toFixed(1)}" y="${(xy[1]-8).toFixed(1)}" text-anchor="middle" font-size="7.4"
      font-weight="700" fill="#26332E" stroke="#F2F6F4" stroke-width="2.4" paint-order="stroke">${q.jibun}</text>`;
  }

  const tgt=tgtIdx!=null
    ? `<path d="${path(tgtIdx)}" fill="#F3B7AE" fill-opacity=".72" stroke="#B3261E" stroke-width="2.6" stroke-linejoin="round"/>
       <circle cx="160" cy="120" r="3" fill="#B3261E"/>`
    : `<circle cx="160" cy="120" r="13" fill="none" stroke="#B3261E" stroke-width="2.4"/>
       <circle cx="160" cy="120" r="3.4" fill="#B3261E"/>`;

  let me='';
  if(gpsOK()){
    const xy=P([gpsPos.lng,gpsPos.lat]);
    if(xy[0]>=0&&xy[0]<=W&&xy[1]>=0&&xy[1]<=H){
      const x=xy[0].toFixed(1), y=xy[1].toFixed(1);
      const ar=Math.max(5,Math.min(70,(gpsPos.acc||0)*k));
      me=`<circle cx="${x}" cy="${y}" r="${ar.toFixed(1)}" fill="#1D4E89" opacity=".13"/>
          <circle cx="${x}" cy="${y}" r="6.5" fill="#fff"/><circle cx="${x}" cy="${y}" r="4.4" fill="#1D4E89"/>`;
    }else{
      const b=distBearing(c,[gpsPos.lng,gpsPos.lat]).b, a=(b-(compassOn&&heading!=null?heading:0))*D2R;
      const ex=W/2+Math.sin(a)*(W/2-17), ey=H/2-Math.cos(a)*(H/2-17);
      me=`<g transform="translate(${ex.toFixed(1)},${ey.toFixed(1)}) rotate(${(a/D2R).toFixed(0)})">
        <circle r="10" fill="#fff" opacity=".85"/><path d="M0 -9L6.4 7L0 3L-6.4 7Z" fill="#1D4E89"/></g>`;
    }
  }

  const nice=span<=200?50:span<=400?100:200, bw=(nice*k).toFixed(1);
  const nrot=(-(compassOn&&heading!=null?heading:0)).toFixed(0);
  const chrome=`<g transform="translate(13,${H-15})">
      <path d="M0 0h${bw}M0 -4v8M${bw} -4v8" stroke="#31423C" stroke-width="1.8" stroke-linecap="round"/>
      <text x="${(bw/2)}" y="-8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#31423C"
        stroke="#F2F6F4" stroke-width="2.4" paint-order="stroke">${nice}m</text></g>
    <g transform="translate(${W-19},19)"><circle r="14" fill="#fff" opacity=".85"/>
      <g transform="rotate(${nrot})"><path d="M0 -11L4.8 6L0 2L-4.8 6Z" fill="#B3261E"/>
      <path d="M0 11L4.8 -6L0 -2L-4.8 -6Z" fill="#31423C" opacity=".35"/></g>
      <text x="0" y="-15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#31423C">N</text></g>`;

  return `<svg class="mcanvas" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="${p.label} 주변 ${span}미터 범위 지적도"><rect width="${W}" height="${H}" fill="#EFF3F1"/>
    ${layers}${ours}${route}${tgt}${marks}${labels}${me}${chrome}</svg>`;
}

function miniBar(p){
  let info='위치를 찾는 중입니다';
  if(gpsErr===1) info='위치 권한이 꺼져 있습니다';
  else if(gpsErr) info='위치를 못 잡았습니다 · 하늘이 트인 곳에서 잠시 기다려 주세요';
  else if(gpsOK()){
    const r=distBearing([gpsPos.lng,gpsPos.lat],GEO[p.id]);
    info=`여기서 <b>${mfmt(r.d)} ${dirName(r.b)}쪽</b> · 오차 ${Math.round(gpsPos.acc||0)}m`;
  }
  const cmp=compassErr?'나침반 안 됨':compassOn?'방향 맞춤':'방향 맞추기';
  return `<div class="mbar">${MSPANS.map((s,i)=>
      `<button data-span="${i}" aria-pressed="${i===mspan}">${s<1000?s+'m':'1km'}</button>`).join('')}
    <button data-compass aria-pressed="${compassOn}">${cmp}</button>
    <span class="mgps">${info}</span></div>
    <div class="mleg"><i style="background:${CATFILL[1]}"></i>전<i style="background:${CATFILL[0]}"></i>답<i
      style="background:${CATFILL[2]}"></i>도로<i style="background:${CATFILL[3]}"></i>물길<i
      style="background:${CATFILL[4]}"></i>대지<em>붉은 칸이 이 필지</em></div>`;
}

function drawMini(id){
  const el=document.getElementById('mini-'+id); if(!el) return;
  const p=PARCELS.find(x=>x.id===id);
  if(!GEO[id]){
    el.innerHTML=`<div class="mno">이 필지는 좌표 자료가 없습니다.<br>2025년 농지전수조사 대상이 아니었던 지번이라 약도를 그릴 수 없습니다.<br>아래 <b>지도</b> 버튼으로 네이버지도에서 확인해 주세요.</div>`;
    return;
  }
  el.innerHTML=miniSvg(p)+miniBar(p);
  el.querySelectorAll('[data-span]').forEach(b=>b.onclick=()=>{ mspan=+b.dataset.span; drawMini(id); });
  const cb=el.querySelector('[data-compass]'); if(cb) cb.onclick=toggleCompass;
}
function syncChev(){
  document.querySelectorAll('[data-mini]').forEach(b=>
    b.setAttribute('aria-expanded', String(b.dataset.mini===openMini)));
}
function toggleMini(id){
  const same=openMini===id;
  document.querySelectorAll('.mini.on').forEach(x=>{x.classList.remove('on');x.innerHTML='';});
  if(same){ openMini=null; syncChev(); stopGps(); stopCompass(); return; }
  openMini=id;
  const el=document.getElementById('mini-'+id);
  if(el){ el.classList.add('on'); drawMini(id); }
  syncChev(); startGps();
}
function reopenMini(){          /* 목록을 다시 그려도 펼쳐둔 약도는 그대로 둔다 */
  if(!openMini) return;
  const el=document.getElementById('mini-'+openMini);
  if(el){ el.classList.add('on'); drawMini(openMini); }
  syncChev();
}
const refreshMini=()=>{ if(openMini) drawMini(openMini); };

function startGps(){
  if(gpsWatch!=null) return;
  if(!navigator.geolocation){ gpsErr=2; refreshMini(); return; }
  gpsErr=0;
  gpsWatch=navigator.geolocation.watchPosition(
    r=>{ gpsErr=0; gpsPos={lat:+r.coords.latitude,lng:+r.coords.longitude,acc:+r.coords.accuracy||0}; refreshMini(); },
    e=>{ gpsErr=e.code||2; refreshMini(); },
    {enableHighAccuracy:true,maximumAge:10000,timeout:60000});
}
function stopGps(){
  if(gpsWatch!=null){ navigator.geolocation.clearWatch(gpsWatch); gpsWatch=null; }
}

/* ── 마을 넘기기 (상단 칩 순서대로 · 탭과 좌우 스와이프가 같은 길을 쓴다) ── */
const chips=()=>[...VILLAGES,'done'];
function goChip(v){
  if(v==='done'){ vill='done'; tab='done'; }
  else { vill=v; const ts=tabsOf(vill); tab=ts.includes(tab)?tab:ALL; }
  render();
}
function slideTo(dx,v){
  const el=document.getElementById('list');
  el.classList.remove('sl','sr');
  goChip(v);
  window.scrollTo(0,0);
  void el.offsetWidth;                 /* 같은 방향으로 연속해서 넘겨도 애니메이션이 다시 돈다 */
  el.classList.add(dx<0?'sl':'sr');
}
(function bindSwipe(){
  const el=document.getElementById('list');
  let x0=0,y0=0,t0=0,on=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ on=false; return; }
    const t=e.touches[0];
    /* 화면 좌우 끝은 브라우저의 뒤로가기 제스처 자리라 건드리지 않는다 */
    if(t.clientX<24||t.clientX>window.innerWidth-24){ on=false; return; }
    x0=t.clientX; y0=t.clientY; t0=Date.now(); on=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!on) return; on=false;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Date.now()-t0>1200) return;                         /* 아주 오래 끈 것만 스크롤로 본다 */
    if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.6) return;   /* 세로로 더 움직였으면 무시 */
    const list=chips(), j=list.indexOf(vill)+(dx<0?1:-1);
    if(j<0){ toast('첫 마을입니다'); return; }
    if(j>=list.length){ toast('마지막 화면입니다'); return; }
    slideTo(dx,list[j]);
  },{passive:true});
})();

/* ── 네이버지도 앱 우선 실행 ── */
function openNaverMap(addr){
  const q=encodeURIComponent(addr);
  const appUrl=`nmap://search?query=${q}&appname=gaeryeong.nongji.check`;
  const webUrl=`https://map.naver.com/p/search/${q}`;
  const isAndroid=/android/i.test(navigator.userAgent);

  if(isAndroid){
    location.href=`intent://search?query=${q}&appname=gaeryeong.nongji.check#Intent;scheme=nmap;package=com.nhn.android.nmap;S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
    return;
  }
  let left=false;
  const mark=()=>{left=true;};
  document.addEventListener('visibilitychange',mark,{once:true});
  location.href=appUrl;
  setTimeout(()=>{
    document.removeEventListener('visibilitychange',mark);
    if(!left) window.open(webUrl,'_blank');
  },900);
}

/* ── 사진 내보내기 ──
   안드로이드·PC 는 곧바로 내려받으면 파일명 그대로 갤러리(다운로드 폴더)에 들어간다.
   아이폰은 이 방식이 사진첩이 아니라 파일 앱으로 가버려서 공유창을 거쳐야 한다. */
const IS_IOS=/iP(hone|od|ad)/.test(navigator.userAgent)||
  (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function exportPhoto(file,name){
  if(IS_IOS) return await saveOrShowPhoto(file,name);
  try{ dl(file,name); toast(`${name} 저장됨`); return true; }
  catch(e){ toast('사진첩 저장에 실패했습니다'); return false; }
}

/* ── 촬영 ── */
async function saveOrShowPhoto(file,name){
  let named=file;
  try{ named=new File([file],name,{type:file.type||'image/jpeg'}); }catch(e){}

  if(navigator.canShare && navigator.canShare({files:[named]})){
    try{
      await navigator.share({files:[named],title:name});
      toast(`${name} 저장됨`);
      return true;
    }catch(e){
      if(e && e.name==='AbortError'){ toast('저장을 취소했습니다'); return false; }
      /* 공유 실패 시 아래 대체 방법으로 진행 */
    }
  }

  const url=URL.createObjectURL(named);
  openSheet(`<h2>사진 저장</h2><p class="sub">${name}</p>
    <img src="${url}" style="width:100%;border-radius:12px;margin-bottom:12px;display:block" alt="촬영된 사진">
    <p class="sub" style="margin-bottom:16px">사진을 <b>길게 눌러</b> '사진에 추가'를 선택하면 저장됩니다.</p>
    <div class="mbtn"><button id="photoClose" class="pri">확인</button></div>`);
  const btn=document.getElementById('photoClose');
  if(btn) btn.onclick=()=>{ closeSheet(); setTimeout(()=>URL.revokeObjectURL(url),1000); };
  return true;
}

async function shoot(id,input){
  const f=input.files&&input.files[0]; if(!f)return;
  const p=PARCELS.find(x=>x.id===id),s=st(id),n=(s.pn||s.shots||0)+1;
  const ext=(f.type.split('/')[1]||'jpg').replace('jpeg','jpg');
  const name=`${p.fname} (${n}).${ext}`;
  input.value='';
  if(IS_IOS) toast('사진을 보관했습니다 · 사진첩 저장은 사진 목록에서');
  else await exportPhoto(f,name);          /* 안드로이드는 묻지 않고 곧바로 갤러리로 */
  await keepPhoto(id,n,name,f);
  state[id]={...s,shots:s.shots+1,pn:n}; await store.set(state);
  render();
}

/* ══════════ 사진 보관함 (IndexedDB · 축소본은 계속, 원본은 최근 것만) ══════════ */
const PDB='gaeryeong-photos', PSTORE='photos';
const THUMB_EDGE=900, THUMB_Q=.7, FULL_KEEP=100;
let _pdb=null;
function pdb(){
  if(_pdb) return _pdb;
  _pdb=new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('NO_IDB')); return; }
    const r=indexedDB.open(PDB,1);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains(PSTORE)){
        const os=d.createObjectStore(PSTORE,{keyPath:'key'});
        os.createIndex('parcel','parcel'); os.createIndex('at','at');
      }
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  return _pdb;
}
/* 트랜잭션 하나를 열어 fn 이 만든 요청의 결과를 돌려준다 */
const preq=(mode,fn)=>pdb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction(PSTORE,mode), r=fn(t.objectStore(PSTORE));
  t.oncomplete=()=>res(r?r.result:undefined);
  t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
}));

/* 확인용 축소본 · 장변 900px 로 줄인다 */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('IMG')); i.src=url;
    });
    const k=Math.min(1,THUMB_EDGE/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*k));
    c.height=Math.max(1,Math.round(img.naturalHeight*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',THUMB_Q));
  } finally { URL.revokeObjectURL(url); }
}

/* 원본은 최근 FULL_KEEP 장만 남기고 오래된 것부터 비운다 (축소본은 그대로 둔다) */
async function pruneFulls(){
  const d=await pdb();
  await new Promise((res,rej)=>{
    const t=d.transaction(PSTORE,'readwrite');
    const cur=t.objectStore(PSTORE).index('at').openCursor(null,'prev');
    let kept=0;
    cur.onsuccess=e=>{
      const c=e.target.result; if(!c) return;
      const v=c.value;
      if(v.full){ kept++; if(kept>FULL_KEEP) c.update({...v,full:null}); }
      c.continue();
    };
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
  });
}

async function keepPhoto(id,n,name,file){
  try{
    const thumb=await shrink(file).catch(()=>null);
    await preq('readwrite',os=>os.put({key:id+':'+n,parcel:id,n,name,at:Date.now(),thumb,full:file}));
    await pruneFulls();
  }catch(e){
    toast('사진을 앱에 보관하지 못했습니다');   /* 보관 실패해도 촬영 기록 자체는 남긴다 */
  }
}

async function photosOf(id){
  try{
    const rows=await preq('readonly',os=>os.index('parcel').getAll(id));
    return (rows||[]).sort((a,b)=>a.n-b.n);
  }catch(e){ return []; }
}

    const kept=rows.filter(r=>r.full).length;
    mid=`<div class="pgrid">${body}</div>

  }
  openSheet(head+mid+(s.shots||rows.length

    try{ const rs=await photosOf(id); await preq('readwrite',os=>{rs.forEach(r=>os.delete(r.key))}); }catch(e){}
    const cur=st(id);
    state[id]={...cur,shots:0,pn:0};
    await store.set(state); closeSheet(); render(); toast('사진 기록을 초기화했습니다');
  };

  document.querySelectorAll('[data-resave]').forEach(b=>b.onclick=async()=>{
    const r=await preq('readonly',os=>os.get(b.dataset.resave));

    try{ await preq('readwrite',os=>os.delete(b.dataset.pdel)); }catch(e){}

    state[id]={...cur,shots:Math.max(0,cur.shots-1)};
    await store.set(state); render(); toast('사진을 지웠습니다');
    showPhotos(id);
  });
}

/* 설정 · 보관 현황과 비우기 */
async function showPhotoBox(){
  let n=0,full=0,used=null;
  try{
    const d=await pdb();
    await new Promise((res,rej)=>{
      const t=d.transaction(PSTORE,'readonly');
      const cur=t.objectStore(PSTORE).openCursor();
      cur.onsuccess=e=>{const c=e.target.result; if(!c) return; n++; if(c.value.full) full++; c.continue();};
      t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);
    });
  }catch(e){}
  try{ if(navigator.storage&&navigator.storage.estimate) used=(await navigator.storage.estimate()).usage; }catch(e){}
  const mb=used==null?null:Math.round(used/1048576);
  openSheet(`<h2>보관된 사진</h2>
    <p class="sub">앱 안에 보관 중인 사진입니다. 확인용이며 백업이 아닙니다.</p>
    <p class="pnote">전체 ${n}장 · 원본이 남은 것 ${full}장${mb==null?'':` · 사용 중인 저장 공간 약 ${mb}MB`}<br>
    원본은 최근 ${FULL_KEEP}장만 유지되고 오래된 것부터 자동으로 비워집니다. 축소본은 계속 남습니다.</p>
    <button class="opt danger" id="pclr"><span class="oic">${IC.trash}</span><span><b>보관된 사진 전부 비우기</b>
      <span>앱 안의 사진만 지웁니다. 확인 표시·메모·사진 매수 기록과 사진 앱에 저장한 파일은 그대로입니다.</span></span></button>`);
  const b=document.getElementById('pclr');
  if(b) b.onclick=async()=>{
    if(!confirm('앱에 보관된 사진을 모두 지웁니다.\n사진 앱에 저장해 둔 파일은 그대로 남습니다.\n\n비울까요?')) return;

  };

/* ══════════ XLSX 생성기 (라이브러리 없음 · 오프라인) ══════════ */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
const ENC=new TextEncoder(),DEC=new TextDecoder();
function zipStore(files){
  const n=new Date();
  const dt=((n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1))&0xFFFF;
  const dd=(((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate())&0xFFFF;
  const p=[],c=[];let off=0,cl=0;
  for(const f of files){
    const nb=ENC.encode(f.name),d=f.data,cr=crc32(d),sz=d.length;
    const l=new DataView(new ArrayBuffer(30));
    l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);
    l.setUint16(8,0,true);l.setUint16(10,dt,true);l.setUint16(12,dd,true);
    l.setUint32(14,cr,true);l.setUint32(18,sz,true);l.setUint32(22,sz,true);l.setUint16(26,nb.length,true);
    p.push(new Uint8Array(l.buffer),nb,d);
    const v=new DataView(new ArrayBuffer(46));
    v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);
    v.setUint16(8,0x0800,true);v.setUint16(12,dt,true);v.setUint16(14,dd,true);
    v.setUint32(16,cr,true);v.setUint32(20,sz,true);v.setUint32(24,sz,true);
    v.setUint16(28,nb.length,true);v.setUint32(42,off,true);
    c.push(new Uint8Array(v.buffer),nb);
    off+=30+nb.length+sz; cl+=46+nb.length;
  }
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cl,true);e.setUint32(16,off,true);
  return new Blob([...p,...c,new Uint8Array(e.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const COL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s};

function sheetXml(sh){
  const cols=`<cols>${sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`;
  const rows=sh.rows.map((r,ri)=>{
    const h=sh.heights&&sh.heights[ri];
    const cells=r.map((c,ci)=>{
      if(c==null)return `<c r="${COL(ci)+(ri+1)}"${sh.rowStyle&&sh.rowStyle[ri]?` s="${sh.rowStyle[ri]}"`:''}/>`;
      const ref=COL(ci)+(ri+1),s=c.s?` s="${c.s}"`:'';
      if(c.t==='f')return `<c r="${ref}"${s} t="str"><f>${X(c.v)}</f></c>`;
      if(c.t==='n')return `<c r="${ref}"${s}><v>${c.v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${X(c.v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}"${h?` ht="${h}" customHeight="1"`:''}>${cells}</row>`;
  }).join('');
  const mg=sh.merges&&sh.merges.length?`<mergeCells count="${sh.merges.length}">${sh.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:'';
  const fr=sh.freeze?`<pane ySplit="${sh.freeze}" topLeftCell="A${sh.freeze+1}" activePane="bottomLeft" state="frozen"/>`:'';
  const af=sh.filter?`<autoFilter ref="${sh.filter}"/>`:'';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0" showGridLines="0">${fr}</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="18"/>${cols}<sheetData>${rows}</sheetData>${af}${mg}
<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" paperSize="9" fitToWidth="1" fitToHeight="0"/></worksheet>`;
}

/* ══════════ XLSX 읽기 (양방향 복원) ══════════ */
async function inflateRaw(u8){
  if(!('DecompressionStream' in window)) throw new Error('NO_DS');
  const ds=new DecompressionStream('deflate-raw');
  const st=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),out={};
  let eo=-1;
  for(let i=u.length-22;i>=0&&i>u.length-66000;i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break}
  if(eo<0) throw new Error('BAD_ZIP');
  let p=dv.getUint32(eo+16,true); const n=dv.getUint16(eo+8,true);
  for(let k=0;k<n;k++){
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true);
    const lo=dv.getUint32(p+42,true);
    const name=DEC.decode(u.slice(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true),lel=dv.getUint16(lo+28,true);
    const ds=lo+30+lnl+lel, raw=u.slice(ds,ds+csz);
    out[name]={method,raw};
    p+=46+nl+el+cl;
  }
  return out;
}
const UNESC=s=>String(s==null?'':s)
  .replace(/&#x([0-9a-fA-F]+);/g,(_,x)=>String.fromCodePoint(parseInt(x,16)))
  .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
  .replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function readXlsx(file){
  const zip=await unzip(await file.arrayBuffer());
  const get=async n=>{const f=zip[n];if(!f)return null;
    return DEC.decode(f.method===0?f.raw:await inflateRaw(f.raw))};
  // 공유문자열
  const ssXml=await get('xl/sharedStrings.xml'); const ss=[];
  if(ssXml) for(const m of ssXml.matchAll(/<si>([\s\S]*?)<\/si>/g))
    ss.push(UNESC([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));
  // 시트 목록
  const wb=await get('xl/workbook.xml'); const names=[...wb.matchAll(/<sheet [^>]*name="([^"]*)"/g)].map(m=>UNESC(m[1]));
  const grids=[];
  for(let i=1;i<=names.length;i++){
    const sx=await get(`xl/worksheets/sheet${i}.xml`); if(!sx)continue;
    const g=[];
    for(const rm of sx.matchAll(/<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g)){
      const ri=+rm[1]-1; g[ri]=g[ri]||[];
      for(const cm of rm[2].matchAll(/<c r="([A-Z]+)\d+"([^>]*)>([\s\S]*?)<\/c>/g)){
        let ci=0; for(const ch of cm[1]) ci=ci*26+(ch.charCodeAt(0)-64); ci--;
        const t=(cm[2].match(/t="([^"]*)"/)||[])[1]; const body=cm[3];
        let v='';
        if(t==='inlineStr'){v=[...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')}
        else if(t==='s'){const iv=(body.match(/<v>(\d+)<\/v>/)||[])[1]; v=ss[+iv]||''}
        else {v=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1]||''}
        g[ri][ci]=UNESC(v);
      }
    }
    grids.push({name:names[i-1],grid:g});
  }
  return grids;
}

async function importXlsx(file){
  let grids;
  try{ grids=await readXlsx(file); }
  catch(e){
    toast(e.message==='NO_DS'?'이 브라우저는 엑셀 읽기를 지원하지 않습니다':'엑셀 파일을 읽지 못했습니다');
    return;
  }
  const sheet=grids.find(g=>g.name==='전체')||grids[0];
  if(!sheet){toast('시트를 찾지 못했습니다');return;}
  const g=sheet.grid;
  let hr=-1;
  for(let i=0;i<Math.min(g.length,12);i++) if(g[i]&&g[i].some(c=>c==='지번')){hr=i;break}
  if(hr<0){toast('머리글에서 지번 열을 찾지 못했습니다');return;}
  const H={}; g[hr].forEach((c,i)=>{if(c)H[String(c).replace(/\s|\(.*/g,'')]=i});
  const idx={jibun:H['지번'],who:H['신청인'],vill:H['리'],
             res:H['1차점검'],area:H['이행면적'],shot:H['사진'],memo:H['현장메모']};
  if(idx.jibun==null){toast('지번 열을 찾지 못했습니다');return;}

  let hit=0,miss=0;
  const next={...state};
  for(let r=hr+1;r<g.length;r++){
    const row=g[r]; if(!row||!row[idx.jibun])continue;
    const jb=String(row[idx.jibun]).trim();
    const wh=idx.who!=null?String(row[idx.who]||'').trim():'';
    const vl=idx.vill!=null?String(row[idx.vill]||'').trim():'';
    /* 같은 지번이 리마다 있을 수 있어 신청인·리까지 함께 본다 */
    const p=PARCELS.find(x=>x.jibun===jb&&(!wh||x.who===wh)&&(!vl||x.village===vl));
    if(!p){miss++;continue}
    const cur=next[p.id]||{shots:0,res:null};
    const rv=idx.res!=null?String(row[idx.res]||'').trim():'';
    const res=RES.includes(rv)?rv:null;
    const sv=idx.shot!=null?String(row[idx.shot]||'').replace(/\D/g,''):'';
    next[p.id]={...cur,
      res, at:res?(cur.at||new Date().toISOString()):null,
      area:idx.area!=null?num(row[idx.area]):cur.area,
      shots:sv?+sv:cur.shots,
      memo:idx.memo!=null?String(row[idx.memo]||'').trim():cur.memo};
    hit++;
  }
  state=next; await store.set(state); render();
  toast(`${hit}건 반영${miss?` · ${miss}건 미일치`:''}`);
}

function dataRow(p){

  return [
    {v:p.no,t:'n',s:C},

    {v:p.tel,s:C},

    {v:p.jibun,s:C},
    {v:num(p.ra),t:'n',s:N},
    {v:num(p.aa),t:'n',s:N},
    {v:p.c1,s:C},
    {v:p.c2,s:C},
    {v:p.item,s:C},
    {v:p.grp,s:C},
    {v:p.sub,s:C},
    {v:p.prev,s:C},
    s.area==null?{v:'',s:10}:{v:s.area,t:'n',s:10},
    {v:D?WHO:'',s:10},
    {v:s.res||'',s:s.res?RSTY[s.res]:10},
    {v:s.shots?s.shots+'장':'',s:10},
    {v:s.at?new Date(s.at).toLocaleString('ko-KR'):'',s:C},
    {v:p.note||'',s:L},
    {v:s.memo||'',s:9},
    {v:`HYPERLINK("https://map.naver.com/p/search/${encodeURIComponent(p.addr)}","지도 열기")`,t:'f',s:8}
  ];
}
function pad(row,n){while(row.length<n)row.push(null);return row}

function tableSheet(name,list,subtitle){
  const rows=[
    pad([{v:`${BIZ} 이행점검 기록 · ${WHO}`,s:1}],NC),
    pad([{v:subtitle,s:22}],NC),
    COLS.map(c=>({v:c,s:3})),
    ...list.map(dataRow)
  ];
  return {name,cols:WID,rows,heights:{0:34,1:22,2:30},
    merges:[`A1:${LAST}1`,`A2:${LAST}2`],freeze:3,filter:`A3:${LAST}${rows.length}`};
}

function summarySheet(){
  const d=PARCELS.filter(p=>isDone(p.id)).length;
  const shots=PARCELS.reduce((a,p)=>a+st(p.id).shots,0);
  const memos=PARCELS.filter(p=>(st(p.id).memo||'').length).length;
  const appArea=PARCELS.reduce((a,p)=>a+(num(p.aa)||0),0);
  const impArea=PARCELS.reduce((a,p)=>a+(num(st(p.id).area)||0),0);
  const R=[];
  R.push(pad([{v:`${BIZ} 이행점검 현황 · ${WHO}`,s:1}],6));
  R.push(pad([{v:new Date().toLocaleString('ko-KR')+` 기준 · ${AREA} ${VILLAGES.join('·')}`,s:22}],6));
  R.push([]);
  R.push([{v:'신청농지',s:20},{v:PARCELS.length,t:'n',s:21},null,{v:'신청면적 합계(㎡)',s:20},{v:Math.round(appArea),t:'n',s:21}]);
  R.push([{v:'점검 완료',s:20},{v:d,t:'n',s:21},null,{v:'이행면적 합계(㎡)',s:20},{v:Math.round(impArea),t:'n',s:21}]);
  R.push([{v:'미점검',s:20},{v:PARCELS.length-d,t:'n',s:21},null,{v:'촬영 사진',s:20},{v:shots,t:'n',s:21}]);
  R.push([{v:'진행률',s:20},{v:Math.round(d/PARCELS.length*100)+'%',s:21},null,{v:'메모 작성',s:20},{v:memos,t:'n',s:21}]);
  R.push([]);
  R.push([{v:'판정',s:3},{v:'필지수',s:3},{v:'이행면적(㎡)',s:3},null,null,null]);
  RES.forEach(r=>{
    const ls=PARCELS.filter(p=>st(p.id).res===r);
    R.push([{v:r,s:RSTY[r]},{v:ls.length,t:'n',s:6},
            {v:Math.round(ls.reduce((a,p)=>a+(num(st(p.id).area)||0),0)),t:'n',s:6}]);
  });
  R.push([{v:'미점검',s:22},{v:PARCELS.length-d,t:'n',s:6},{v:'',s:5}]);
  R.push([]);
  R.push([{v:'리',s:3},{v:'대상',s:3},{v:'점검',s:3},{v:'미점검',s:3},{v:'사진',s:3},{v:'진행률',s:3}]);
  VILLAGES.forEach(v=>{
    const ls=PARCELS.filter(p=>p.village===v), n=ls.filter(p=>isDone(p.id)).length;
    R.push([{v:v,s:22},{v:ls.length,t:'n',s:6},{v:n,t:'n',s:6},{v:ls.length-n,t:'n',s:6},
            {v:ls.reduce((a,p)=>a+st(p.id).shots,0),t:'n',s:6},
            {v:Math.round(n/ls.length*100)+'%',s:5}]);
  });
  R.push([]);
  R.push([{v:'신청인',s:3},{v:'필지',s:3},{v:'신청면적(㎡)',s:3},{v:'점검',s:3},{v:'신청품목',s:3},null]);
  [...new Set(PARCELS.map(p=>p.who))].forEach(w=>{
    const ls=PARCELS.filter(p=>p.who===w);
    R.push([{v:w,s:22},{v:ls.length,t:'n',s:6},
            {v:Math.round(ls.reduce((a,p)=>a+(num(p.aa)||0),0)),t:'n',s:6},
            {v:ls.filter(p=>isDone(p.id)).length,t:'n',s:6},
            {v:[...new Set(ls.map(p=>p.item))].join('·'),s:4},null]);
  });
  R.push([]);
  R.push(pad([{v:'노란색 칸(이행면적·점검자·1차점검·사진·현장 메모)은 엑셀에서 고쳐도 앱으로 다시 불러올 수 있습니다.',s:22}],6));
  return {name:'요약',cols:[16,13,15,16,15,13],rows:R,heights:{0:34,1:22},merges:['A1:F1','A2:F2'],freeze:0};
}

function makeXlsx(){
  const sheets=[summarySheet(),
    tableSheet('전체',PARCELS,`전체 ${PARCELS.length}필지 · ${new Date().toLocaleString('ko-KR')} 기준`)];
  VILLAGES.forEach(v=>{
    const ls=PARCELS.filter(p=>p.village===v);
    sheets.push(tableSheet(v,ls,`${v} ${ls.length}필지 · 점검 ${ls.filter(p=>isDone(p.id)).length}건`));
  });
  const f=`${WHO}_논타작물_이행점검.xlsx`;
  buildXlsx(sheets,f); toast(f+' 저장');
}

  const d=PARCELS.filter(p=>isDone(p.id)).length;
  const shots=PARCELS.reduce((a,p)=>a+st(p.id).shots,0);
  const impArea=PARCELS.reduce((a,p)=>a+(num(st(p.id).area)||0),0);
  const body=VILLAGES.map(v=>{

    <table><thead><tr><th>순번</th><th>신청인</th><th>지번</th><th>신청품목</th><th>중분류</th>
    <th>신청면적</th><th>이행면적</th><th>구분</th><th>사진</th><th>1차점검</th><th>메모 · 비고</th></tr></thead><tbody>
    ${rs.map(({p,s})=>`<tr class="${s.res?'y':''}"><td>${String(p.no).padStart(2,'0')}</td><td class="l">${p.who}</td>
      <td class="l">${p.jibun}</td><td class="l">${p.item}</td><td>${p.c2}</td>
      <td class="r">${p.aaT}</td><td class="r">${s.area==null?'-':comma(num(s.area))}</td>
      <td>${p.grp}</td><td>${s.shots?s.shots+'장':'-'}</td>
      <td class="${s.res?RCLS[s.res]:''}">${s.res||''}</td>
      <td class="l memo">${[p.note?'[대장] '+p.note:'',s.memo||''].filter(Boolean).join(' / ').replace(/</g,'&lt;')}</td></tr>`).join('')}
    </tbody></table>`}).join('');
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"><title>${BIZ} 이행점검 결과 · ${WHO}</title><style>
  body{font-family:-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif;margin:0;padding:26px 20px;
    background:#F2F5F4;color:#0E1614;font-size:13px}
  .wrap{max-width:960px;margin:0 auto;background:#fff;padding:30px;border-radius:14px;
    box-shadow:0 2px 18px rgba(0,0,0,.07)}
  h1{font-size:20px;margin:0 0 4px}.dt{color:#5A6B66;font-size:12.5px;margin:0 0 18px}
  .kpi{display:flex;gap:10px;margin:0 0 22px;flex-wrap:wrap}
  .kpi div{flex:1;min-width:110px;background:#E8F3EF;border-radius:11px;padding:13px 15px}
  .kpi b{display:block;font-size:21px;color:#0B3B33}.kpi span{font-size:11.5px;color:#4A6B62}
  h3{font-size:14.5px;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid #0B3B33}
  h3 small{font-weight:400;color:#5A6B66;font-size:12px;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  th{background:#0B3B33;color:#fff;padding:7px 6px;font-weight:600;font-size:11.5px}
  td{padding:6px;border-bottom:1px solid #E3E9E7;text-align:center}
  td.l{text-align:left}td.r{text-align:right}td.memo{color:#3C4B46;font-size:11.5px;max-width:230px}
  td.ok{color:#14574A;font-weight:700}td.no{color:#B3261E;font-weight:700}td.hold{color:#8A5A00;font-weight:700}
  tr.y td{background:#F4FAF7}
  .no-print{margin:0 0 18px}
  button{background:#0B3B33;color:#fff;border:0;padding:11px 20px;border-radius:10px;
    font-size:13.5px;font-weight:600;cursor:pointer}
  @media print{body{background:#fff;padding:0}.wrap{box-shadow:none;padding:0;border-radius:0}
    .no-print{display:none}h3{page-break-after:avoid}tr{page-break-inside:avoid}}
  </style></head><body><div class="wrap">
  <div class="no-print"><button onclick="print()">인쇄 · PDF로 저장</button></div>
  <h1>${BIZ} 신청농지 이행점검 결과</h1>
  <p class="dt">${AREA} ${VILLAGES.join('·')} · 점검자 ${WHO} · ${new Date().toLocaleString('ko-KR')} 기준</p>
  <div class="kpi"><div><b>${PARCELS.length}</b><span>신청농지</span></div>
  <div><b>${d}</b><span>점검 완료</span></div>
  <div><b>${PARCELS.length-d}</b><span>미점검</span></div>
  <div><b>${comma(Math.round(impArea))}</b><span>이행면적(㎡)</span></div>

  /* 팝업이 막히면 사용자가 직접 누를 수 있는 링크로 대신 연다 */

function makeCsv(){
  const Q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const head=['순번','읍면동','리','신청인','주소','연락처','농지소재지','지번','공부상면적','신청면적',
    '대분류','중분류','신청품목','대구분','구분','전년품목','이행면적','점검자','1차점검','사진매수',
    '점검시각','비고(특이사항)','현장메모'];
  const rows=PARCELS.map(p=>{const s=st(p.id);return [
    p.no,EMD,p.village,p.who,Q(p.home),p.tel,Q(p.addr),p.jibun,p.ra,p.aa,p.c1,p.c2,p.item,p.grp,p.sub,p.prev,
    s.area==null?'':s.area, s.res?WHO:'', s.res||'', s.shots||0,
    s.at?new Date(s.at).toLocaleString('ko-KR'):'', Q(p.note||''), Q(s.memo||'')];});
  dl(new Blob(['﻿'+[head,...rows].map(r=>r.join(',')).join('\n')],{type:'text/csv'}),
     `${WHO}_논타작물_이행점검_${new Date().toISOString().slice(0,10)}.csv`);
  toast('CSV를 저장했습니다');
}

function backup(){
  dl(new Blob([JSON.stringify({v:1,app:'nongji',saved:new Date().toISOString(),state},null,1)],{type:'application/json'}),
     `${WHO}_이행점검_진행상황_${new Date().toISOString().slice(0,10)}.json`);
  toast('백업 파일을 저장했습니다');
}
document.getElementById('xlsxFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  toast('엑셀을 읽는 중입니다'); await importXlsx(f); e.target.value='';
};
document.getElementById('restoreFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    try{const j=JSON.parse(r.result); state=j.state||j; await store.set(state); render();
      toast('진행상황을 되살렸습니다');}
    catch(err){toast('백업 파일을 읽지 못했습니다');}
    e.target.value='';
  };
  r.readAsText(f);
};
function doReset(){
  if(!confirm('판정·이행면적·사진 매수·메모가 모두 지워집니다.\n찍은 사진 파일은 그대로 남습니다.\n\n초기화할까요?'))return;
  state={};store.set(state);vill=VILLAGES[0];tab=ALL;render();toast('진행상황을 초기화했습니다');
}

document.getElementById('q').oninput=e=>{q=e.target.value;render()};

(async()=>{
  storageOK=checkStorage();
  if(!storageOK) document.getElementById('warn').classList.add('on');
  state=await store.get(); restorePos(); render();
})();
</script>
